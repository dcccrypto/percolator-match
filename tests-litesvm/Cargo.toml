# LiteSVM integration tests for the matcher's compiled BPF program (v2) with a v1
# (12bd671, the deployed matcher) parity baseline. Standalone: its own [workspace] so
# it is NOT part of the percolator-match package build, and its own Cargo.lock so the
# litesvm/agave-2.2 dependency tree never touches the program's lockfile.
[package]
name = "percolator-match-litesvm-tests"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]

[dev-dependencies]
# The program crate itself, host-side only, for the wire encoders (InitParams::encode,
# CallExt::encode, SetParams::encode, encode_configure, MatcherCtx::write_to).
percolator-match = { path = "..", features = ["no-entrypoint"] }
litesvm = "=0.6.1"
solana-account = "2.2"
solana-instruction = "2.2"
solana-keypair = "2.2"
solana-message = "2.2"
solana-pubkey = { version = "2.2", features = ["curve25519"] }
solana-signer = "2.2"
solana-transaction = "2.2"
solana-transaction-error = "2.2"
