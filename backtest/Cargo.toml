[package]
name = "percolator-match-backtest"
version = "0.1.0"
edition = "2021"
publish = false
description = "Offline LP backtest harness for percolator-match v2 (drives the real on-chain pricing code)"

# Own workspace so this crate is NOT part of the matcher package / its CI.
[workspace]

[dependencies]
percolator-match = { path = "..", features = ["no-entrypoint"] }
solana-program = "2.0"

[profile.release]
opt-level = 3
debug = false
